name: Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-plugins:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff on plugins
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.9"
          args: "check plugins"

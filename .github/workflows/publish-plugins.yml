name: Publish plugins

# Manually triggered. Plans the publish order from the plugins' inter-dependencies, then publishes dependency level by dependency level:
# dependency level 0 = plugins depending on no other unpublished local plugin, dependency level 1 = their direct dependents, and so on.
# Plugins within a dependency level are published in parallel; a dependency level starts only after the previous one succeeded.
# Versions that already exist on PyPI are skipped.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build and `poetry publish --dry-run`, nothing is uploaded)
        required: true
        default: true
        type: boolean

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      dependency_levels: ${{ steps.plan.outputs.dependency_levels }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plan publish order
        id: plan
        run: python .github/scripts/plan_publish.py plugins --max-dependency-levels 6

  dependency-level-0:
    name: Dependency level 0
    needs: [plan]
    if: ${{ !failure() && !cancelled() && needs.plan.result == 'success' && fromJson(needs.plan.outputs.dependency_levels)[0] != null }}
    uses: ./.github/workflows/publish-plugin-dependency-level.yml
    with:
      plugins: ${{ toJSON(fromJson(needs.plan.outputs.dependency_levels)[0]) }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  dependency-level-1:
    name: Dependency level 1
    needs: [plan, dependency-level-0]
    if: ${{ !failure() && !cancelled() && needs.plan.result == 'success' && fromJson(needs.plan.outputs.dependency_levels)[1] != null }}
    uses: ./.github/workflows/publish-plugin-dependency-level.yml
    with:
      plugins: ${{ toJSON(fromJson(needs.plan.outputs.dependency_levels)[1]) }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  dependency-level-2:
    name: Dependency level 2
    needs: [plan, dependency-level-1]
    if: ${{ !failure() && !cancelled() && needs.plan.result == 'success' && fromJson(needs.plan.outputs.dependency_levels)[2] != null }}
    uses: ./.github/workflows/publish-plugin-dependency-level.yml
    with:
      plugins: ${{ toJSON(fromJson(needs.plan.outputs.dependency_levels)[2]) }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

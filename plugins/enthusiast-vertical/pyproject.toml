[tool.poetry]
name = "enthusiast-vertical"
version = "1.0.0"
description = "Ecommerce vertical for Enthusiast — Product and Document Django models with pgvector embeddings."
authors = ["Mateusz Porebski <mateusz.porebski@upsidelab.io>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
enthusiast-vertical-common = ">=1.0.0"
django = ">=5.2,<6.0"
pgvector = ">=0.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
